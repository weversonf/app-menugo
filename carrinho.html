<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasa & Cia — Carrinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --carvao: #1A1410;
    --carvao-2: #241B14;
    --carvao-3: #2E2219;
    --creme: #FFF8F0;
    --creme-dim: #D8CCC0;
    --fogo: #FF6B35;
    --fogo-dim: #E85A2A;
    --chama: #FFB627;
    --brasa: #C1272D;
    --acai: #5B8C3E;
    --linha: rgba(255,248,240,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--carvao); color:var(--creme);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Archivo Black', sans-serif; letter-spacing:-0.02em; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(26,20,16,0.88); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--linha);
    padding:16px 20px; font-size:15px; font-weight:800;
  }
  .topbar-inner{ max-width:1100px; margin:0 auto; }

  .wrap{ max-width:560px; margin:0 auto; padding:20px; }

  .cart-item{
    display:flex; gap:12px; padding:14px 0;
    border-bottom:1px solid var(--linha);
  }
  .ci-img{ width:68px; height:68px; border-radius:12px; background-size:cover; background-position:center; flex-shrink:0; }
  .ci-info{ flex:1; min-width:0; }
  .ci-name{ font-size:14px; font-weight:700; margin-bottom:2px; }
  .ci-obs{ font-size:11.5px; color:var(--creme-dim); margin-bottom:6px; font-style:italic; }
  .ci-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .ci-price{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--chama); font-weight:700; }
  .ci-qty{ display:flex; align-items:center; gap:8px; }
  .ci-qty button{ width:26px; height:26px; border-radius:7px; background:var(--carvao-3); color:var(--creme); font-size:14px; display:flex; align-items:center; justify-content:center; }
  .ci-qty span{ font-family:'JetBrains Mono', monospace; font-size:13px; min-width:16px; text-align:center; }
  .ci-remove{ color:var(--brasa); font-size:11px; font-weight:600; margin-top:6px; display:inline-block; }

  .cart-empty{ text-align:center; padding:80px 20px; color:var(--creme-dim); }
  .cart-empty svg{ opacity:0.35; margin-bottom:14px; }
  .cart-empty a{
    display:inline-block; margin-top:18px;
    background:var(--fogo); color:var(--carvao);
    padding:12px 22px; border-radius:12px; font-weight:800; font-size:13.5px;
  }

  .coupon-row{ display:flex; gap:8px; margin:18px 0 10px; }
  .coupon-row input{
    flex:1; background:var(--carvao-3); border:1px solid var(--linha);
    border-radius:10px; padding:10px 12px; color:var(--creme); font-size:12.5px;
    outline:none; text-transform:uppercase; font-family:'JetBrains Mono', monospace;
  }
  .coupon-row input:focus{ border-color:var(--fogo); }
  .coupon-row button{
    background:var(--carvao-3); border:1px solid var(--linha); color:var(--creme);
    padding:0 16px; border-radius:10px; font-size:12px; font-weight:700;
  }
  .coupon-applied{ font-size:11.5px; color:var(--acai); display:flex; align-items:center; gap:6px; margin-bottom:14px; }

  .summary{ background:var(--carvao-2); border:1px solid var(--linha); border-radius:16px; padding:18px; margin-top:14px; }
  .sum-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--creme-dim); margin-bottom:8px; }
  .sum-row.total{ color:var(--creme); font-weight:800; font-size:16px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--linha); }
  .sum-row b{ font-family:'JetBrains Mono', monospace; color:var(--creme); }
  .sum-row.total b{ color:var(--chama); font-size:18px; }

  .btn-primary{
    width:100%; background:var(--fogo); color:var(--carvao);
    padding:15px; border-radius:14px; font-size:14.5px; font-weight:800;
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
  }
  .btn-primary:hover{ background:var(--fogo-dim); }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--creme); color:var(--carvao);
    padding:13px 20px; border-radius:100px; font-size:13px; font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:200;
    opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bnav-spacer{ height:78px; }
  .bnav{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    background:rgba(26,20,16,0.92); backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,248,240,0.08);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around; align-items:center;
  }
</style>
</head>
<body>

  <header class="topbar"><div class="topbar-inner">🔥 Brasa & Cia</div></header>

  <main class="wrap">
    <h1 style="font-size:22px; margin-bottom:18px;">Seu carrinho</h1>
    <div id="cartItems"></div>
    <div id="cartSummaryWrap"></div>
  </main>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
  /* =========================================================
     IMPORTANTE — dívida técnica deliberada neste protótipo:
     Como cardapio.html e carrinho.html são arquivos HTML
     separados sem backend ou build compartilhado, a lista de
     PRODUCTS e CUPONS está DUPLICADA aqui. Numa implementação
     real (Next.js + Supabase, conforme a documentação), isso
     viraria uma única fonte de dados via API — duplicar este
     array manualmente é prática apenas para o protótipo estático.
     ========================================================= */
  const TAXA_ENTREGA = 6.90;

  const PRODUCTS = [
    { id:1, cat:'hamburgueres', nome:'Brasa Bacon', preco:28.90, img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500' },
    { id:2, cat:'hamburgueres', nome:'Cheddar Melt', preco:26.50, img:'https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=500' },
    { id:3, cat:'hamburgueres', nome:'Veggie da Brasa', preco:24.90, img:'https://images.unsplash.com/photo-1525059696034-4967a729002e?w=500' },
    { id:4, cat:'hamburgueres', nome:'Clássico Brasa', preco:22.90, img:'https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=500' },
    { id:5, cat:'pizzas', nome:'Pizza Calabresa', preco:42.00, img:'https://images.unsplash.com/photo-1604068549290-dea0e4a305ca?w=500' },
    { id:6, cat:'pizzas', nome:'Pizza Margherita', preco:38.00, img:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500' },
    { id:7, cat:'pizzas', nome:'Pizza Quatro Queijos', preco:44.00, img:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500' },
    { id:8, cat:'sushi', nome:'Combo Salmão (20pç)', preco:54.90, img:'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500' },
    { id:9, cat:'sushi', nome:'Hot Roll Philadelphia', preco:32.00, img:'https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?w=500' },
    { id:10, cat:'acai', nome:'Açaí 500ml Completo', preco:19.90, img:'https://images.unsplash.com/photo-1490323914169-d3ef9ba88f10?w=500' },
    { id:11, cat:'acai', nome:'Açaí Power 700ml', preco:24.90, img:'https://images.unsplash.com/photo-1626078299034-558772f4d2c2?w=500' },
    { id:12, cat:'bebidas', nome:'Coca-Cola Lata 350ml', preco:6.00, img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?w=500' },
    { id:13, cat:'bebidas', nome:'Suco Natural Laranja 500ml', preco:9.50, img:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500' },
    { id:14, cat:'sobremesas', nome:'Brownie com Sorvete', preco:18.00, img:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500' },
    { id:15, cat:'sobremesas', nome:'Petit Gateau', preco:21.00, img:'https://images.unsplash.com/photo-1624353365286-3f8d62daad51?w=500' },
  ];

  const COUPONS = {
    'BRASA10': { tipo:'percentual', valor:10, label:'10% OFF' },
    'FRETEGRATIS': { tipo:'frete_gratis', valor:0, label:'Frete grátis' },
    'BEMVINDO5': { tipo:'fixo', valor:5, label:'R$5 OFF' },
  };

  let cart = loadCart();
  let appliedCoupon = null;

  const fmt = (n) => 'R$ ' + n.toFixed(2).replace('.', ',');

  function loadCart(){
    try{
      const raw = localStorage.getItem('brasa_cart');
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveCart(){
    try{ localStorage.setItem('brasa_cart', JSON.stringify(cart)); }catch(e){}
    if(window.BottomNav) BottomNav.setCartCount(cartCount());
  }

  function cartCount(){ return cart.reduce((s,i)=>s+i.qty, 0); }
  function cartSubtotal(){
    return cart.reduce((s,i)=>{
      const p = PRODUCTS.find(x=>x.id===i.productId);
      return p ? s + (p.preco * i.qty) : s;
    }, 0);
  }
  function calcDiscount(subtotal){
    if(!appliedCoupon) return 0;
    if(appliedCoupon.tipo==='percentual') return subtotal * (appliedCoupon.valor/100);
    if(appliedCoupon.tipo==='fixo') return Math.min(appliedCoupon.valor, subtotal);
    return 0;
  }
  function calcDelivery(){
    if(appliedCoupon && appliedCoupon.tipo==='frete_gratis') return 0;
    return cart.length ? TAXA_ENTREGA : 0;
  }

  function removeFromCart(uid){
    cart = cart.filter(i=>i.uid!==uid);
    saveCart();
    render();
  }
  function changeQty(uid, delta){
    const item = cart.find(i=>i.uid===uid);
    if(!item) return;
    item.qty += delta;
    if(item.qty<=0){ removeFromCart(uid); return; }
    saveCart();
    render();
  }

  const cartItemsEl = document.getElementById('cartItems');
  const summaryWrap = document.getElementById('cartSummaryWrap');

  function render(){
    if(cart.length===0){
      cartItemsEl.innerHTML = `
        <div class="cart-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <p>Seu carrinho está vazio.</p>
          <a href="cardapio.html">Ver cardápio</a>
        </div>
      `;
      summaryWrap.innerHTML = '';
      return;
    }

    cartItemsEl.innerHTML = cart.map(item=>{
      const p = PRODUCTS.find(x=>x.id===item.productId);
      if(!p) return '';
      return `
        <div class="cart-item">
          <div class="ci-img" style="background-image:url('${p.img}')"></div>
          <div class="ci-info">
            <div class="ci-name">${p.nome}</div>
            ${item.obs ? `<div class="ci-obs">Obs: ${item.obs}</div>` : ''}
            <div class="ci-bottom">
              <div class="ci-qty">
                <button data-uid="${item.uid}" data-d="-1" aria-label="Diminuir">−</button>
                <span>${item.qty}</span>
                <button data-uid="${item.uid}" data-d="1" aria-label="Aumentar">+</button>
              </div>
              <span class="ci-price">${fmt(p.preco*item.qty)}</span>
            </div>
            <a href="#" class="ci-remove" data-uid="${item.uid}">Remover</a>
          </div>
        </div>
      `;
    }).join('');

    cartItemsEl.querySelectorAll('.ci-qty button').forEach(btn=>{
      btn.addEventListener('click', ()=> changeQty(parseFloat(btn.dataset.uid), parseInt(btn.dataset.d)) );
    });
    cartItemsEl.querySelectorAll('.ci-remove').forEach(a=>{
      a.addEventListener('click', (e)=>{ e.preventDefault(); removeFromCart(parseFloat(a.dataset.uid)); });
    });

    const subtotal = cartSubtotal();
    const discount = calcDiscount(subtotal);
    const delivery = calcDelivery();
    const total = subtotal - discount + delivery;

    summaryWrap.innerHTML = `
      <div class="coupon-row">
        <input type="text" id="couponInput" placeholder="CUPOM DE DESCONTO" value="${appliedCoupon ? document.getElementById('couponInput')?.value || '' : ''}">
        <button id="couponBtn">Aplicar</button>
      </div>
      <div id="couponMsg"></div>
      <div class="summary">
        <div class="sum-row"><span>Subtotal</span><b>${fmt(subtotal)}</b></div>
        <div class="sum-row"><span>Desconto</span><b style="color:var(--acai);">− ${fmt(discount)}</b></div>
        <div class="sum-row"><span>Taxa de entrega</span><b>${delivery===0 ? 'Grátis' : fmt(delivery)}</b></div>
        <div class="sum-row total"><span>Total</span><b>${fmt(total)}</b></div>
      </div>
      <button class="btn-primary" id="checkoutBtn"><span>Finalizar pedido</span><span>→</span></button>
    `;

    if(appliedCoupon){
      document.getElementById('couponMsg').innerHTML = `<div class="coupon-applied">✓ Cupom aplicado — ${appliedCoupon.label}</div>`;
    }

    document.getElementById('couponBtn').addEventListener('click', applyCoupon);
    document.getElementById('couponInput').addEventListener('keypress', (e)=>{ if(e.key==='Enter') applyCoupon(); });
    document.getElementById('checkoutBtn').addEventListener('click', ()=> showToast('Em breve: checkout completo 🚀'));
  }

  function applyCoupon(){
    const input = document.getElementById('couponInput');
    const code = input.value.trim().toUpperCase();
    if(!code) return;
    const coupon = COUPONS[code];
    if(coupon){
      appliedCoupon = coupon;
      showToast(`Cupom aplicado: ${coupon.label}`);
    } else {
      showToast('Cupom inválido');
      appliedCoupon = null;
    }
    render();
  }

  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer;
  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  render();
</script>

<script src="bottom-nav.js"></script>
<script>
  BottomNav.render('carrinho');
</script>
</body>
</html>
